<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Nowcasting Fotonico</title>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial;
            background: #f4f4f4;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        .controls-panel {
            width: 280px;
            min-width: 280px;
            padding: 10px;
            box-sizing: border-box;
            background: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        h2 {
            font-size: 20px;
            text-align: center;
            margin: 0 0 10px 0;
        }

        button,
        select,
        input {
            padding: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        .utc-label {
            text-align: center;
            font-size: 16px;
            display: block;
            margin-top: 5px;
            margin-bottom: 15px;
            color: #444;
        }

        .image-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #f4f4f4;
        }

        .image-panel img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scaleX(1.1);
            transform-origin: center;
        }
    </style>

</head>

<body>

    <div class="container">

        <!-- SIDEBAR -->
        <div class="controls-panel">

            <h2>Ensemble Nowcasting Radar ARPAL</h2>

            {% set current_time = time %}
            {% set ora = current_time.split(':')[0] %}
            {% set minuto = current_time.split(':')[1] %}

            <form id="mainForm" method="POST">

                <span class="utc-label" id="utcClock">
                    Sono le --:-- UTC
                </span>

                <input type="date" name="date" value="{{ data }}" required>

                <select name="time">
                    {% for h in range(24) %}
                    {% for m in range(0, 60, 15) %}
                    {% set val = "%02d:%02d" % (h, m) %}
                    <option value="{{ val }}" {% if val==time %}selected{% endif %}>
                        {{ val }}
                    </option>
                    {% endfor %}
                    {% endfor %}
                </select>

                <input type="hidden" name="indice" value="{{ indice }}">

                <button type="submit" name="action" value="load">
                    Carica dalla prima (Enter)
                </button>

                <button type="submit" name="action" value="latest">
                    Ultimo Run
                </button>

            </form>

        </div>

        <!-- IMAGE -->
        <div class="image-panel">

            {% if immagine_corrente %}
            <img id="mainImg" src="{{ immagine_corrente }}" data-index="{{ indice }}">
            {% else %}
            <p>Nessuna immagine trovata</p>
            {% endif %}

        </div>

    </div>

    <script>

        /* =========================
           ORA UTC
        ========================= */
        function aggiornaOraUTC() {

            const now = new Date();

            const ore = String(now.getUTCHours()).padStart(2, '0');
            const minuti = String(now.getUTCMinutes()).padStart(2, '0');

            document.getElementById("utcClock").textContent =
                `Sono le ${ore}:${minuti} UTC`;
        }

        aggiornaOraUTC();
        setInterval(aggiornaOraUTC, 1000);

        /* =========================
           FORM BUTTONS
        ========================= */
        const form = document.getElementById("mainForm");
        const dateInput = form.querySelector('input[name="date"]');

        form.querySelector('button[value="latest"]').addEventListener("click", function () {
            dateInput.removeAttribute("required");
        });

        form.querySelector('button[value="load"]').addEventListener("click", function () {
            dateInput.setAttribute("required", "required");
        });

        /* =========================
           IMMAGINI
        ========================= */
        const imageList = {{immagini | tojson | safe }};
        const maxIndex = imageList.length - 1;

        const img = document.getElementById("mainImg");

        let cache = new Map();

        function preload(src) {
            if (!src || cache.has(src)) return;
            const im = new Image();
            im.src = src;
            cache.set(src, im);
        }

        function preloadAllIdle() {
            let i = 0;

            function step() {
                if (i >= imageList.length) return;
                preload(imageList[i]);
                i++;

                if (window.requestIdleCallback) {
                    requestIdleCallback(step, {timeout: 200});
                } else {
                    setTimeout(step, 10);
                }
            }

            step();
        }

        preloadAllIdle();

        /* =========================
           KEYBOARD CONTROL
        ========================= */
        document.addEventListener("keydown", function (event) {

            if (event.key === "Enter") {

                event.preventDefault();

                const inputIndice =
                    form.querySelector('input[name="indice"]');

                if (inputIndice) inputIndice.value = 0;

                form.submit();
                return;
            }

            let i = parseInt(img.dataset.index || "{{ indice }}");

            if (event.key === "ArrowRight") {
                i++;
            } else if (event.key === "ArrowLeft") {
                i--;
            } else {
                return;
            }

            if (i < 0) i = 0;
            if (i > maxIndex) i = maxIndex;

            const src = imageList[i];

            if (cache.has(src)) {
                img.src = src;
            } else {
                img.src = src;
                preload(src);
            }

            img.dataset.index = i;
        });

    </script>

</body>

</html>
